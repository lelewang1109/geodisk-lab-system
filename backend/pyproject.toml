[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodisk-deltaannulus-paper"
version = "0.1.0"
description = "Reproducible spatial-fidelity benchmark for GeoDisk and GeoAnnulus"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "matplotlib>=3.8",
  "netCDF4>=1.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "pyshp>=2.3",
  "scipy>=1.11",
  "shapely>=2.0",
  "xarray>=2024.1",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
geodisk-api = "geodisk_paper.api:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
